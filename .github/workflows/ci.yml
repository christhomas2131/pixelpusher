name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-mac:
    name: Build & test (macOS arm64)
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # @electron/rebuild 4.x requires Node >= 22.12; electron-builder 26 inherits.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: |
          npx tsc -p tsconfig.main.json --noEmit
          npx tsc -p tsconfig.renderer.json --noEmit

      - name: Run tests
        run: npm test

      - name: Build (main + renderer)
        run: npm run build

      - name: Run e2e smoke tests
        run: npx playwright test
        env:
          # Sentry off in CI; would otherwise upload events from every PR run.
          SENTRY_DSN: ''

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Package per-arch .dmg + .zip
        run: npm run dist
        env:
          # No signing in CI without secrets — electron-builder skips when identity is null.
          # When Apple Developer creds are available, set them as repo secrets and add:
          #   APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID
          # or APPLE_API_KEY / APPLE_API_KEY_ID / APPLE_API_ISSUER
          # plus CSC_LINK + CSC_KEY_PASSWORD, then flip mac.identity / hardenedRuntime / notarize
          # in electron-builder.yml. CI will pick them up automatically.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Verify per-arch binary architectures
        # Per-arch builds (post universal-build removal): each .app should
        # contain ONLY its own arch slice, never universal. arm64 lives at
        # release/mac-arm64/, x64 at release/mac/ (electron-builder default
        # for the legacy primary arch).
        run: |
          set -e
          declare -A APPS=(
            [arm64]="release/mac-arm64/PixelPusher.app"
            [x64]="release/mac/PixelPusher.app"
          )
          for arch in arm64 x64; do
            APP="${APPS[$arch]}"
            BIN="$APP/Contents/MacOS/PixelPusher"
            echo "=== $arch main exec ($BIN) ==="
            if [ ! -f "$BIN" ]; then
              echo "FAIL: $BIN not found"; exit 1
            fi
            lipo -info "$BIN"
            # Expected slice per arch — and definitely NOT universal:
            EXPECT="$([ "$arch" = "arm64" ] && echo "arm64" || echo "x86_64")"
            lipo -info "$BIN" | grep -q "$EXPECT" \
              || (echo "FAIL: $arch main exec missing $EXPECT slice" && exit 1)
            lipo -info "$BIN" | grep -q "x86_64 arm64" \
              && (echo "FAIL: $arch main exec is universal (should be single-arch)" && exit 1) \
              || true
            echo "=== $arch native .node files ==="
            find "$APP" -name "*.node" | while read f; do
              echo "$f"
              lipo -info "$f"
            done
          done

      - name: Verify Info.plist TCC keys
        # TCC keys are identical between arches; check arm64 as the canonical one.
        run: |
          PLIST="release/mac-arm64/PixelPusher.app/Contents/Info.plist"
          for key in NSDesktopFolderUsageDescription NSDocumentsFolderUsageDescription \
                     NSDownloadsFolderUsageDescription NSRemovableVolumesUsageDescription \
                     NSNetworkVolumesUsageDescription; do
            plutil -p "$PLIST" | grep -q "\"$key\"" || (echo "FAIL: $key missing from Info.plist" && exit 1)
            echo "  $key  ✓"
          done

      - name: Upload .dmg + .zip artifacts
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: PixelPusher-mac-per-arch
          path: |
            release/PixelPusher-*-arm64.dmg
            release/PixelPusher-*-x64.dmg
            release/PixelPusher-*-arm64.zip
            release/PixelPusher-*-x64.zip
          retention-days: 14
          if-no-files-found: error
