name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-mac:
    name: Build & test (macOS arm64)
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # @electron/rebuild 4.x requires Node >= 22.12; electron-builder 26 inherits.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: |
          npx tsc -p tsconfig.main.json --noEmit
          npx tsc -p tsconfig.renderer.json --noEmit

      - name: Run tests
        run: npm test

      - name: Build (main + renderer)
        run: npm run build

      - name: Run e2e smoke tests
        run: npx playwright test
        env:
          # Sentry off in CI; would otherwise upload events from every PR run.
          SENTRY_DSN: ''

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Package universal .dmg
        run: npm run dist
        env:
          # No signing in CI without secrets — electron-builder skips when identity is null.
          # When Apple Developer creds are available, set them as repo secrets and add:
          #   APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID
          # or APPLE_API_KEY / APPLE_API_KEY_ID / APPLE_API_ISSUER
          # plus CSC_LINK + CSC_KEY_PASSWORD, then flip mac.identity / hardenedRuntime / notarize
          # in electron-builder.yml. CI will pick them up automatically.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Verify universal binary architecture
        run: |
          BIN="release/mac-universal/PixelPusher.app/Contents/MacOS/PixelPusher"
          echo "=== main exec ==="
          lipo -info "$BIN"
          lipo -info "$BIN" | grep -q "x86_64 arm64" || (echo "FAIL: main exec is not universal" && exit 1)
          echo "=== native .node files ==="
          find release/mac-universal/PixelPusher.app -name "*.node" | while read f; do
            echo "$f"
            lipo -info "$f"
          done

      - name: Verify Info.plist TCC keys
        run: |
          PLIST="release/mac-universal/PixelPusher.app/Contents/Info.plist"
          for key in NSDesktopFolderUsageDescription NSDocumentsFolderUsageDescription \
                     NSDownloadsFolderUsageDescription NSRemovableVolumesUsageDescription \
                     NSNetworkVolumesUsageDescription; do
            plutil -p "$PLIST" | grep -q "\"$key\"" || (echo "FAIL: $key missing from Info.plist" && exit 1)
            echo "  $key  ✓"
          done

      - name: Upload .dmg artifact
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: PixelPusher-mac-universal
          path: release/PixelPusher-*.dmg
          retention-days: 14
          if-no-files-found: error
