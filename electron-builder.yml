appId: com.pixelpusher.app
productName: PixelPusher
directories:
  output: release
files:
  - dist/**/*
  - package.json
  - node_modules/**/*
win:
  target: nsis
  icon: build/icon.ico
mac:
  target: dmg
  icon: build/icon.icns
linux:
  target: AppImage
  icon: build/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
