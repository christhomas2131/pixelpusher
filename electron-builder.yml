appId: com.pixelpusher.app
productName: PixelPusher
directories:
  output: release
publish:
  provider: github
  owner: christhomas2131
  repo: pixelpusher
files:
  - dist/**/*
  - package.json
  - node_modules/**/*
asarUnpack:
  - "node_modules/better-sqlite3/**/*"
  - "node_modules/sharp/**/*"
  - "node_modules/@img/**/*"
  - "node_modules/exiftool-vendored*/**/*"
win:
  target: nsis
  icon: build/icon.ico
mac:
  category: public.app-category.utilities
  icon: build/icon.icns
  # Single universal binary for both Apple Silicon and Intel.
  # The .zip target is required by electron-updater for Mac auto-updates
  # (Squirrel.Mac reads .zip, not .dmg).
  # Note: electron-builder 26's bundled dmgbuild was built for macOS 15.7
  # and links libintl.8.dylib (gettext). On macOS < 14, the build host
  # needs `brew install gettext` once. CI on macos-latest doesn't need this.
  target:
    - target: dmg
      arch: universal
    - target: zip
      arch: universal
  # ensure-mac-arches.js installs both sharp variants in node_modules, so each
  # per-arch electron-builder packaging step inherits both. The variants are
  # byte-identical across the x64-temp and arm64-temp builds, which causes
  # @electron/universal v2 to error unless they're whitelisted here.
  # x64ArchFiles tells @electron/universal "these duplicate files are OK,
  # ship them as-is in the merged universal bundle."
  x64ArchFiles: "**/{sharp-darwin-arm64,sharp-darwin-x64,sharp-libvips-darwin-arm64,sharp-libvips-darwin-x64}/**"
  # Signing strategy:
  #   identity: null     → unsigned (current — Gatekeeper prompts on first run; TCC silently denies on Sonoma+)
  #   identity: "Developer ID Application: <Name> (<TeamID>)" → real signing
  #
  # electron-builder 24 doesn't accept "-" as an ad-hoc sentinel cleanly.
  # For interim ad-hoc signing, run after the build:
  #   codesign --force --deep --sign - release/mac-universal/PixelPusher.app
  #
  # When you have a Developer ID cert:
  #   1. Set identity to your cert name (or remove the line — auto-detect via CSC_LINK)
  #   2. Set hardenedRuntime: true
  #   3. Set notarize: true (electron-builder picks up creds from APPLE_* env vars; see .env.example)
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  notarize: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSDesktopFolderUsageDescription: "PixelPusher needs access to your Desktop to scan and organize photos and videos stored there."
    NSDocumentsFolderUsageDescription: "PixelPusher needs access to your Documents to scan and organize photos and videos stored there."
    NSDownloadsFolderUsageDescription: "PixelPusher needs access to your Downloads folder so it can move photos and videos out of it."
    NSRemovableVolumesUsageDescription: "PixelPusher needs access to external drives to scan and organize photos and videos stored on them."
    NSNetworkVolumesUsageDescription: "PixelPusher needs access to network shares to scan and organize photos and videos stored on them."
dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
linux:
  target: AppImage
  icon: build/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
